<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>BioPredict — Sign in</title>

<!-- Google Fonts: Inter -->

<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {

              100: '#dbeafe',
              400: '#38bdf8',
              500: '#1d8cf8',
              600: '#1976d2',
              accent: '#0284c7'
            }
          },
          boxShadow: {
            'soft-card': '0 20px 45px -10px rgba(0, 0, 0, 0.08), 0 10px 20px -5px rgba(0, 0, 0, 0.04)',
            'btn-blue': '0 8px 24px -2px rgba(29, 140, 248, 0.45)',
          }
        }
      }
    }

<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Input capsule background style matching reference image */
    .input-capsule {
      background-color: #f1f4f9;
      transition: all 0.2s ease-in-out;
    }

    .input-capsule:focus-within {
      background-color: #ffffff;
      box-shadow: 0 0 0 2px #0284c7;
    }

    /* Dashed trace line alongside the organic wave boundary */
    .wave-boundary-trace {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
<!-- END: Custom Styles -->
<script src="bp.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">
<!-- BEGIN: MainContainer -->
<!-- Outer window container replicating the rounded card presentation with high-fidelity aesthetics -->
<main class="w-full bg-white overflow-hidden relative flex flex-col justify-between min-h-screen h-full">
<!-- BEGIN: TopNavigation -->
<header class="relative z-30 px-8 pt-7 md:px-12 md:pt-10 flex items-center justify-between pointer-events-auto">
<div class="flex items-center gap-12">
<!-- Logo and Brand Name -->
<a class="flex items-center gap-3.5 group" href="login.html">
<div class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 via-sky-500 to-sky-400 shadow-sm shadow-blue-500/30 group-hover:scale-105 transition-transform duration-200"></div>
<span class="text-xl font-bold tracking-tight text-slate-900">BioPredict<span class="text-sky-500">.</span></span>
</a>
<!-- Top Nav Links -->
<nav class="hidden md:flex items-center space-x-9 text-sm font-semibold text-slate-400">
<a class="hover:text-slate-700 transition-colors" href="login.html">Home</a>
<a class="hover:text-slate-700 transition-colors" href="predict.html">Platform</a>
<a class="hover:text-slate-700 transition-colors" href="docs.html">Docs</a>
</nav>
</div>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: ContentAndVisualSplit -->
<div class="relative w-full h-full flex-1 flex flex-col lg:flex-row overflow-hidden">
<!-- BEGIN: LeftFormSection -->
<section class="w-full lg:w-[58%] z-20 flex flex-col justify-center px-8 md:px-14 lg:px-16 py-6 pb-12 lg:pb-16 max-w-xl">
<!-- Eyebrow Subtitle -->
<div class="mb-2">
<span class="text-[11px] md:text-xs tracking-[0.2em] font-bold text-slate-400 uppercase">
            Virtual Screening Access
          </span>
</div>
<!-- Main Title -->
<h1 class="text-3xl md:text-4xl lg:text-[42px] font-extrabold text-slate-900 tracking-tight leading-tight mb-2">
          Log in to account<span class="text-sky-500 text-4xl leading-none">.</span>
</h1>
<!-- Subtitle Link -->
<p class="text-sm font-medium text-slate-400 mb-8 md:mb-10">
          Need molecular database access? <a class="text-sky-600 font-semibold hover:underline" href="#" id="request-token">Request Token</a>
</p>
<!-- Form Elements -->
<form class="space-y-4 md:space-y-5" id="login-form" novalidate>
<!-- Field 1: Username or Gmail -->
<div class="input-capsule rounded-2xl px-5 py-2.5 relative flex flex-col justify-center cursor-text border border-transparent focus-within:border-sky-500">
<span class="text-[11px] font-medium text-slate-400 leading-tight">Username or Gmail</span>
<div class="flex items-center justify-between">
<input class="w-full p-0 text-sm md:text-base font-semibold text-slate-800 bg-transparent border-none focus:ring-0 focus:outline-none placeholder-slate-400" id="username" placeholder="name@organization.com" type="text" autocomplete="username">
<!-- ID/User Card Icon matching reference -->
<span class="text-slate-400 ml-2">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
</div>
</div>
<!-- Field 2: Password (Focused style matching reference image) -->
<div class="bg-white rounded-2xl px-5 py-2.5 relative flex flex-col justify-center border-2 border-sky-500 shadow-sm shadow-sky-500/10 transition-all">
<span class="text-[11px] font-semibold text-sky-600 leading-tight">Password</span>
<div class="flex items-center justify-between">
<input class="w-full p-0 text-base md:text-lg font-bold tracking-widest text-slate-800 bg-transparent border-none focus:ring-0 focus:outline-none" id="password" placeholder="Enter password" type="password" autocomplete="current-password">
<!-- Eye / Visibility Toggle Icon -->
<button aria-label="Toggle password visibility" class="text-slate-400 hover:text-slate-600 transition-colors focus:outline-none p-1" id="togglePassword" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<p id="login-msg" class="text-xs font-semibold text-red-500 min-h-[1rem]" role="alert"></p>
<!-- Action Buttons Area -->
<div class="pt-5 flex items-center gap-4">
<!-- Left Neutral Button: Change method -->
<button id="change-method" class="w-1/2 py-3.5 px-6 rounded-full bg-[#f1f4f9] hover:bg-[#e6ebf3] text-slate-500 text-sm font-semibold text-center transition-all duration-150 active:scale-[0.98]" type="button">
              Change method
            </button>
<!-- Right Primary Button: Sign in -->
<button class="w-1/2 py-3.5 px-6 rounded-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white text-sm font-semibold text-center shadow-btn-blue transition-all duration-200 active:scale-[0.98]" type="submit">
              Sign in
            </button>
</div>
</form>
<p class="text-xs text-slate-400 mt-5">Demo sign-in: this front-end gate only unlocks the app pages; no credentials are stored or sent.</p>
</section>
<!-- END: LeftFormSection -->
<!-- BEGIN: RightVisualSectionWithOrganicWave -->
<section class="absolute top-0 right-0 w-full h-full lg:w-[58%] pointer-events-none z-10 overflow-hidden">
<!-- Photographic Visual representing Bioactive Natural Molecules/Alpine Lake backdrop -->
<div class="absolute inset-0 w-full h-full bg-gradient-to-br from-slate-100 via-sky-50 to-sky-200">
<img onerror="this.style.display='none'" alt="Abstract molecular network with connecting nodes and chemical bonds" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxZjt3go1MHvlHG_BEVLISF7K_QwV1uLuuGcQoDXRaHk0V5dVAyky2cRVvhac3AA-TZc3bvmS3KakRKR5pWShbOOKJitjI0ICCA7nOkhd__vRJ7RaTRjFHnSSxDVkwVffGGqh3R0JUoZSAciS4WhBa4b_Koczv1EUAIBb_DWUskXEpT83XG7nrqrb5LrX4_70G8VPjtSGFfYALqPO595LvF9A4gYLZ8fyMZPH3JHL-rZVRQBPmIkWcXw">
</div>
<!-- SVG Organic Curved Mask Overlaid On Image creating exact wavy cut edge -->
<svg class="absolute inset-0 w-full h-full text-white" fill="currentColor" preserveAspectRatio="none" viewBox="0 0 700 800">
<!-- Flowing organic cut-away path identical to reference -->
<path d="M 0,0 
                   L 260,0 
                   C 190,90 200,170 270,240 
                   C 360,330 380,420 310,510 
                   C 240,600 210,680 280,800 
                   L 0,800 Z"></path>
</svg>
<!-- Fine Dashed Organic Trace Line from reference image -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" preserveAspectRatio="none" viewBox="0 0 700 800">
<path class="opacity-75" d="M 270,0 
                   C 200,90 210,170 280,240 
                   C 370,330 390,420 320,510 
                   C 250,600 220,680 290,800" stroke="#cbd5e1" stroke-dasharray="4 6" stroke-linecap="round" stroke-width="1.8"></path>
</svg>
<!-- Monogram Logo Icon in bottom right corner (from reference '.W.') -->
<div class="absolute bottom-8 right-9 z-20 pointer-events-auto flex items-center gap-1.5 opacity-90 drop-shadow-md">
<span class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span>
<svg class="w-8 h-8 text-white fill-current" viewBox="0 0 40 40">
<path d="M6 10 L12 30 L16 16 L20 30 L26 10 L22 10 L18 24 L14 10 Z"></path>
<path d="M22 10 L28 30 L32 16 L36 30 L42 10 L38 10 L34 24 L30 10 Z" transform="scale(0.8) translate(5, 5)"></path>
</svg>
<span class="w-2 h-2 rounded-full bg-white inline-block"></span>
</div>
</section>
<!-- END: RightVisualSectionWithOrganicWave -->
</div>
<!-- END: ContentAndVisualSplit -->
</main>
<!-- END: MainContainer -->
<script data-purpose="login-logic">
(function(){
  var form=document.getElementById('login-form'), u=document.getElementById('username'),
      p=document.getElementById('password'), msg=document.getElementById('login-msg'),
      tog=document.getElementById('togglePassword'), cm=document.getElementById('change-method'),
      labels=[u.parentElement.previousElementSibling,p.parentElement.previousElementSibling], apiMode=false;
  if(tog) tog.addEventListener('click',function(){
    var show=p.type==='password'; p.type=show?'text':'password';
    tog.classList.toggle('text-sky-600',show); tog.classList.toggle('text-slate-400',!show);
  });
  if(cm) cm.addEventListener('click',function(){
    apiMode=!apiMode; msg.textContent='';
    if(labels[0]) labels[0].textContent=apiMode?'Service account ID':'Username or Gmail';
    if(labels[1]) labels[1].textContent=apiMode?'API key / bearer token':'Password';
    u.placeholder=apiMode?'svc-screening-01':'name@organization.com';
    p.placeholder=apiMode?'bp_live_...':'Enter password';
    cm.textContent=apiMode?'Use password':'Change method';
    u.focus();
  });
  var rt=document.getElementById('request-token');
  if(rt) rt.addEventListener('click',function(e){e.preventDefault(); msg.style.color='#0284c7'; msg.textContent='Token requests are not available in this demo - enter any credentials to continue.';});
  form.addEventListener('submit',function(e){
    e.preventDefault(); msg.style.color='';
    if(!u.value.trim()){msg.textContent='Enter your username or email.'; u.focus(); return;}
    if(!p.value.trim()){msg.textContent=apiMode?'Enter your API key.':'Enter your password.'; p.focus(); return;}
    BP_login(apiMode?'api-key user':u.value.trim());
    location.href='predict.html';
  });
})();
</script>






</body></html>
